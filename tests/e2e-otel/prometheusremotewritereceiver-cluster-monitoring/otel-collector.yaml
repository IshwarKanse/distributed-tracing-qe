apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: prw
spec:
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.158.0
  mode: deployment
  ports:
    - name: prw
      port: 9090
      targetPort: 9090
      protocol: TCP
  config:
    receivers:
      prometheus_remote_write:
        endpoint: 0.0.0.0:9090
    processors:
      batch: {}
    exporters:
      # The metrics received over remote write are exposed again on the Prometheus exporter
      # endpoint, where the test verifies them. A third-party backend would use an OTLP exporter.
      prometheus:
        endpoint: 0.0.0.0:8889
        # job and instance arrive as resource attributes; expose them as labels for the check
        resource_to_telemetry_conversion:
          enabled: true
      debug:
        verbosity: basic
    service:
      pipelines:
        metrics:
          receivers: [prometheus_remote_write]
          processors: [batch]
          exporters: [prometheus, debug]
